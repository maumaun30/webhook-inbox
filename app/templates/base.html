<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Webhook Inbox{% endblock %}</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --line:#e7e5e4; --card:#fff; --ok:#15803d; --bad:#b91c1c; --accent:#1d4ed8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0c0a09; --fg:#f5f5f4; --muted:#a8a29e; --line:#292524; --card:#1c1917; --ok:#4ade80; --bad:#f87171; --accent:#93c5fd; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }
  a { color: var(--accent); text-decoration: none; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  h1 a { color: inherit; }
  form.inline { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  input, select, button { font: inherit; padding: 6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
  button { cursor:pointer; background: var(--fg); color: var(--bg); border-color: var(--fg); }
  table { width:100%; border-collapse: collapse; background: var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: 0; }
  .wrap { overflow-x:auto; }
  .muted { color: var(--muted); }
  .valid { color: var(--ok); } .invalid { color: var(--bad); } .unchecked { color: var(--muted); }
  pre { background: var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; overflow:auto; max-height: 480px; font: 12.5px/1.45 ui-monospace, Menlo, monospace; }
  .grid { display:grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } }
  h2 { font-size: 14px; margin: 16px 0 8px; }
</style>
</head>
<body><main>
<h1><a href="/">Webhook Inbox</a></h1>
{% block content %}{% endblock %}
</main></body>
</html>
